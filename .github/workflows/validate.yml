name: Validate Backrooms

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/validate_repo.py
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --check
