name: Backrooms Cycle

# The world's brain runs here, not on anyone's laptop. Each run carries a few
# bounded cycles at exact thirty-minute spacing on a hosted free-tier model, and
# the concurrency group keeps one run queued behind the current one, so the
# cadence holds even when GitHub's scheduler fires late. Public feeds are
# committed to this repository; the residents' private state lives in a
# separate private repository reached through a deploy key, saved after every
# cycle. No wallet key is ever needed by the runtime.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch the Pages deploy after every cycle

concurrency:
  group: backrooms-cycle
  cancel-in-progress: false

env:
  STATE_REPOSITORY: SRHSoulja/backrooms-state

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the private runtime state
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STATE_REPOSITORY }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Bubblewrap when the runner allows it (the sandbox probes capability and falls back otherwise)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap || true
      - name: Place the provider keys where the router reads them (never printed, never in the checkout)
        # Any provider the router knows can be added as a repository secret of the
        # same name; unset secrets are skipped. The router uses whichever exist,
        # in BACKROOMS_PROVIDER_ORDER, so a second free provider is a fallback.
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGSEARCH_API_KEY: ${{ secrets.LANGSEARCH_API_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/backrooms.env"
          for name in MISTRAL_API_KEY GEMINI_API_KEY GROQ_API_KEY CEREBRAS_API_KEY OPENROUTER_API_KEY LANGSEARCH_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> "$RUNNER_TEMP/backrooms.env"; fi
          done
          echo "BACKROOMS_ENV_FILE=$RUNNER_TEMP/backrooms.env" >> "$GITHUB_ENV"
      - name: Run three bounded cycles at thirty-minute spacing, publishing after each
        env:
          BACKROOMS_RUNTIME_HOST: github-actions
          BACKROOMS_LOCAL_MODEL: never
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # After every cycle: save the private state, then redeploy the site so
          # the page never lags the feeds (a token push does not trigger the
          # Pages workflow, but a workflow_dispatch from the token does).
          BACKROOMS_POST_CYCLE: >-
            git -C state add -A &&
            (git -C state diff --cached --quiet || git -C state commit -q -m "cycle state") &&
            git -C state push -q &&
            (gh workflow run pages.yml --ref main || true)
        run: |
          git config user.name 'Backrooms Steward'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C state config user.name 'Backrooms Steward'
          git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/local_daemon.py --publish --interval 1800 --max-cycles 3
      - name: Save the private runtime state
        if: always()
        run: |
          cd state
          git config user.name 'Backrooms Steward'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "cycle state"
          git push
      - name: Remove the provider key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/backrooms.env"

  deploy:
    # Backstop: the site is also dispatched after every cycle above; this final
    # deploy covers a run whose dispatch failed.
    needs: cycle
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
