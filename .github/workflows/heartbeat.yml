name: Backrooms Public Heartbeat

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/free_heartbeat.py
      - run: python3 scripts/treasury_check.py
      - run: python3 scripts/market_watch.py
      - name: Publish heartbeat
        run: |
          git config user.name 'Backrooms Heartbeat'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/heartbeat.json docs/treasury.json docs/market-watch.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record public heartbeat"
          git pull --rebase --autostash origin main
          git push
