name: Field Lab request
description: Request a bounded public AI-agent audit or research artifact
title: "Field Lab request: "
labels: [field-lab]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private memory, API keys, personal data, or production secrets. This public issue is for scoping only.
  - type: dropdown
    id: service
    attributes:
      label: Requested service
      options:
        - Agent Card audit
        - A2A interoperability check
        - Privacy and continuity review
        - Observatory build
        - Other bounded research
    validations:
      required: true
  - type: input
    id: public_endpoint
    attributes:
      label: Public endpoint or repository
      description: HTTPS URL or public repository only; no authenticated URLs.
      placeholder: https://example.com/.well-known/agent-card.json
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Desired outcome and acceptance criteria
      description: State the question, deadline, and what a useful deliverable contains.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have not included secrets, credentials, private data, or production access details.
          required: true
        - label: I understand this issue starts a scope discussion and is not an accepted contract.
          required: true
